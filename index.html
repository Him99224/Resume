<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tushar Saxena | Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --line: #e5e7eb;
      --ok: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 980px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .resume {
      display: grid;
      gap: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);
      padding: 1.25rem;
    }

    .hero {
      display: grid;
      gap: 1rem;
      align-items: center;
      grid-template-columns: auto 1fr;
    }

    .avatar {
      width: 122px;
      height: 122px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary-soft);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .tagline {
      color: var(--ok);
      font-weight: 600;
      margin-top: 0.35rem;
    }

    .muted {
      color: var(--muted);
      margin: 0.4rem 0 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }

    ul {
      margin: 0;
      padding-left: 1.2rem;
      display: grid;
      gap: 0.45rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }

    .chip {
      background: var(--primary-soft);
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
      font-weight: 600;
    }

    .grid-2 {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .avatar {
        margin: 0 auto;
      }

      .tabs {
        justify-content: center;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const sectionData = {
      summary: {
        title: "Summary",
        content: (
          <p>
            I am a motivated and imaginative developer who enjoys building useful software,
            collaborating with people, and learning new technologies quickly.
          </p>
        ),
      },
      education: {
        title: "Education",
        content: (
          <ul>
            <li>Completed 12th Standard from Madhavrao Scindia Public School (2022).</li>
            <li>Completed a web development course on Udemy guided by Dr. Angela Yu (2024).</li>
            <li>Pursuing B.Tech from Sharda School of Engineering and Technology.</li>
          </ul>
        ),
      },
      skills: {
        title: "Skills",
        content: (
          <div>
            <p className="muted">Core technologies I currently work with:</p>
            <div className="chips">
              <span className="chip">C</span>
              <span className="chip">Python</span>
              <span className="chip">HTML</span>
              <span className="chip">CSS</span>
              <span className="chip">JavaScript</span>
              <span className="chip">Problem Solving</span>
            </div>
          </div>
        ),
      },
      strengths: {
        title: "Strengths",
        content: (
          <ul>
            <li>Strong team collaboration and leadership experience from school and college projects.</li>
            <li>High learning mindset and willingness to adapt quickly.</li>
            <li>Comfortable working under pressure while maintaining quality.</li>
          </ul>
        ),
      },
      achievements: {
        title: "Achievements",
        content: (
          <ul>
            <li>
              Ranked under top 1 million coders on LeetCode -{" "}
              <a href="https://leetcode.com/u/Him99224/" target="_blank" rel="noreferrer">
                View profile
              </a>
            </li>
          </ul>
        ),
      },
      contact: {
        title: "Contact",
        content: (
          <ul>
            <li>Name: Tushar Saxena</li>
            <li>Email: <a href="mailto:tusharsaxena99224@gmail.com">tusharsaxena99224@gmail.com</a></li>
            <li>Location: Bareilly, Uttar Pradesh, India</li>
          </ul>
        ),
      },
      hobbies: {
        title: "Hobbies",
        content: (
          <ul>
            <li>Playing guitar</li>
            <li>Listening to music</li>
            <li>Gaming in free time</li>
            <li>Socializing and networking</li>
            <li>Learning System Design and developing scalable systems</li>
          </ul>
        ),
      },
    };

    function App() {
      const [activeTab, setActiveTab] = React.useState("summary");
      const current = sectionData[activeTab];

      return (
        <main className="container">
          <section className="resume">
            <article className="card hero">
              <img className="avatar" src="./Screenshot_20230101_042213.jpg" alt="Portrait of Tushar Saxena" />
              <div>
                <h1>Tushar Saxena</h1>
                <p className="tagline">Aspiring Software Engineer</p>
                <p className="muted">
                  Building a strong foundation in programming and web development with practical,
                  project-focused learning.
                </p>
                <div className="tabs">
                  {Object.entries(sectionData).map(([key, section]) => (
                    <button
                      key={key}
                      className={`tab ${activeTab === key ? "active" : ""}`}
                      onClick={() => setActiveTab(key)}
                    >
                      {section.title}
                    </button>
                  ))}
                </div>
              </div>
            </article>

            <article className="card">
              <h2>{current.title}</h2>
              {current.content}
            </article>

            <section className="grid-2">
              <article className="card">
                <h2>Work Experience</h2>
                <p className="muted">
                  Fresher. Currently focused on strengthening development skills through practice,
                  coursework, and coding challenges.
                </p>
              </article>

              <article className="card">
                <h2>Quick Links</h2>
                <ul>
                  <li>
                    <a href="mailto:tusharsaxena99224@gmail.com">Email me</a>
                  </li>
                  <li>
                    <a href="https://leetcode.com/u/Him99224/" target="_blank" rel="noreferrer">
                      LeetCode Profile
                    </a>
                  </li>
                </ul>
              </article>
            </section>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
